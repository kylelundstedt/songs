<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <title>Songs</title>
</head>
<body>
<header class="app-header">
  <nav class="tabs" aria-label="Main navigation">
    <a class="tab active" href="/songs" aria-current="page">Songs <span class="tab-count">{{.SongCount}}</span></a>
    <a class="tab" href="/set-lists">Set Lists <span class="tab-count">{{.SetCount}}</span></a>
  </nav>
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch color mode" title="Switch color mode"><span aria-hidden="true">◐</span></button>
</header>
<main class="library-shell songs-screen">
  <section class="song-tools">
    <label class="search compact"><span class="sr-only">Find a song</span><input id="song-search" type="search" autocomplete="off" autofocus placeholder="Find a song…"></label>
    <a class="button primary" href="/songs/new" data-add-song>Add a Song</a>
  </section>
  <div class="song-list" id="song-list">
    {{range .Songs}}<a class="song-row" href="/song/{{.ID}}" data-search="{{.Title}} {{.ID}}"><span>{{.Title}}</span></a>{{end}}
  </div>
  <section class="empty-state no-results-card" id="no-results" hidden>
    <h2>No matching song</h2>
    <p>Create a new lead-sheet draft using the title you entered.</p>
    <a class="button primary" href="/songs/new" data-add-missing-song>Add this Song</a>
  </section>
</main>
<script src="/static/app.js" defer></script>
</body></html>
